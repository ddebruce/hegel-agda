[book]
title = "Hegel's Logic in Cubical Agda"
authors = ["David DeBruce"]
language = "en"
src = "src"

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/ddebruce/hegel-agda"
edit-url-template = "https://github.com/ddebruce/hegel-agda/edit/main/book/{path}"
additional-css = []

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3
